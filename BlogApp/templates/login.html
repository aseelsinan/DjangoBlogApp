{% extends 'base.html' %}
{%load crispy_forms_tags%}


{% block content %}
<div class="container py-5" style="max-width: 500px;">    
    <h1 class="txt-center">Login</h1>
    <form action="{%url 'login'%}" method="post">
        {% csrf_token %}
        
        
            {{form|crispy}}
            <button type="submit" class="btn btn-warning btn-sm text-dark txt-center">Login</button>
         </form>
</div>
{% endblock  %}
