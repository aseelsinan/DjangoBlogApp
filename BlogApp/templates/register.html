{% extends 'base.html' %}
{%block content%}
{%load crispy_forms_tags%}
<div class="container py-5">
  <h2 class="mb-4" style="font-family: 'Playfair Display', serif">
  <h1 class="txt-center">Register</h1>
<form action="{%url 'register'%}" method="post" style="max-width: 500px; margin: auto;" >
    {%csrf_token%}
    {{form | crispy}}
    <button type="submit" class="btn btn-warning btn-sm text-dark txt-center">Register</button>
</form>
  
</div>

{%endblock%}
